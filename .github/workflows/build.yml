- name: Deploy Backend
  uses: appleboy/ssh-action@v1.2.2
  with:
    host: ${{ secrets.SERVER_HOST }}
    username: ${{ secrets.SERVER_USERNAME }}
    key: ${{ secrets.SERVER_SSH_KEY }}
    port: 22
    script: |
      docker pull ${{ secrets.DOCKER_USERNAME }}/backend_recheck:v1

      docker stop backend_recheck 2>/dev/null || true
      docker rm backend_recheck 2>/dev/null || true

      docker run -d \
        --name backend_recheck \
        -p 8081:8081 \
        ${{ secrets.DOCKER_USERNAME }}/backend_recheck:v1

      docker ps
